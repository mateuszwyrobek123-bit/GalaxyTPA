  accepted-other: "&7Gracz &e{player} &7zaakceptował twoją prośbę o teleportację!"
  teleport-soon: "&7Zostaniesz przeteleportowany za &a{seconds}s&7!"
  denied-self: "&aOdrzuciłeś prośbę o teleportację od gracza &2{player}&a!"
  denied-other: "&cTwoja prośba o teleportację do &e{player} &czostała odrzucona."

  countdown: "&7Zostaniesz &fprzeteleportowany &7za &a{seconds}s&7!"
  teleported-title: "&7Zostałeś &fprzeteleportowany&7!"
  teleported-chat: "&aZostałeś przeteleportowany!"
  cancelled-title: "&7Teleportacja &azostała &7anulowana!"
  cancelled-chat: "&cAnulowano teleportację z powodu ruchu!"
