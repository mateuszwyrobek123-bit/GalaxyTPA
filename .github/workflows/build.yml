name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Znajdz i uloz pliki
        run: |
          echo "=== PLIKI W REPO ==="
          find . -path ./.git -prune -o -type f -print
          mkdir -p src/main/java/pl/galaxy/tpa src/main/resources
          place() {
            if [ -f "$2/$1" ]; then return; fi
            F=$(find . -name "$1" -not -path './.git/*' -not -path './target/*' | head -n1)
            if [ -z "$F" ]; then echo "BRAK PLIKU $1 W REPO"; exit 1; fi
            cp "$F" "$2/$1"
          }
          place GalaxyTPA.java src/main/java/pl/galaxy/tpa
          place VaultHook.java src/main/java/pl/galaxy/tpa
          place plugin.yml src/main/resources
          place config.yml src/main/resources
          echo "=== PO UKLADANIU ==="
          find src -type f

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B clean package

      - name: Sprawdz zawartosc jara
        run: |
          unzip -l target/GalaxyTPA-1.0.0.jar
          unzip -l target/GalaxyTPA-1.0.0.jar | grep -q "plugin.yml"
          unzip -l target/GalaxyTPA-1.0.0.jar | grep -q "config.yml"
          unzip -l target/GalaxyTPA-1.0.0.jar | grep -q "pl/galaxy/tpa/GalaxyTPA.class"

      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyTPA
          path: target/GalaxyTPA-1.0.0.jar
